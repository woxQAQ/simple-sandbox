version: '3.8'

services:
  sandbox-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: sandbox-test
    environment:
      - PYTHONPATH=/app
      - NODE_PATH=/app/src/runtime/nodejs
      - PYTHONUNBUFFERED=1
    volumes:
      - ../tests:/app/tests
      - ../coverage.xml:/app/coverage.xml
    command: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
    networks:
      - sandbox-network

  sandbox-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sandbox-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - NODE_PATH=/app/src/runtime/nodejs
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sandbox-network

networks:
  sandbox-network:
    driver: bridge

volumes:
  test-coverage: