[tool:pytest]
# e2e测试配置
testpaths = suites
python_files = test*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --color=yes

# 标记定义
markers =
    e2e: 端到端测试
    python: Python测试
    nodejs: Node.js测试
    security: 安全测试
    plugins: 插件测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 最小版本要求
minversion = 6.0

# 测试会话配置
console_output_style = progress
junit_family = xunit2

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 缓存配置
cache_dir = .pytest_cache