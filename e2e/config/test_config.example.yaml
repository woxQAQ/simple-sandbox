# E2E Test Configuration Example
# Copy this file to test_config.yaml and modify as needed

# Runtime configuration
runtime:
  # Container backend: podman, docker, k8s
  backend: "podman"
  
  # Concurrency settings
  max_concurrency: 4
  max_queue: 16
  
  # Container registry settings (empty for local images)
  image_registry: ""
  registry_username: ""
  registry_password: ""
  registry_auth: ""
  registry_identity_token: ""
  k8s_image_pull_secret: ""

# Language-specific configurations
languages:
  python:
    repository: "localhost/sandbox-python"
    tag: "latest"
    registry: ""
    seccomp:
      k8s_mode: "runtimeDefault"
      k8s_localhost_ref: ""
  
  node:
    repository: "localhost/sandbox-node"
    tag: "latest"
    registry: ""
    seccomp:
      k8s_mode: "runtimeDefault"
      k8s_localhost_ref: ""