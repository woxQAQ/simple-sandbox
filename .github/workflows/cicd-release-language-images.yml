name: CICD Release Language Images

on:
  push:
    branches: [ main, feat/go-port ]
    paths:
      - 'docker/runtimes/*'
      - '.github/workflows/cicd-release-language-images.yml'
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - 'docker/runtimes/*'
  #     - '.github/workflows/cicd-release-language-images.yml'

env:
  REGISTRY: docker.io
  PYTHON_IMAGE_NAME: woxqaq/sandbox-python
  NODE_IMAGE_NAME: woxqaq/sandbox-node

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, node]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=moby/buildkit:master
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/go-port'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.PYTHON_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value={{sha}}
    
    - name: Build and push ${{ matrix.language }} image
      run: make build-${{ matrix.language }}-runtime
