name: CICD Release API Server Image

on:
  push:
    branches: [ main, feat/go-port]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'docker/apiserver/Dockerfile'
      - '.github/workflows/cicd-release-apiserver-image.yml'
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - 'cmd/**'
  #     - 'internal/**'
  #     - 'go.mod'
  #     - 'go.sum'
  #     - 'docker/apiserver/Dockerfile'
  #     - '.github/workflows/cicd-release-apiserver-image.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: woxqaq/sandbox-apiserver

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: go.sum

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=moby/buildkit:master
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/go-port'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push API server image
      run: make build-apiserver