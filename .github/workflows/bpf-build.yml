name: BPF Library Build

# 触发条件
on:
  push:
    branches: [ main ]
    paths:
      - 'src/security/bpf/**'
      - 'src/security/static/**'
      - '.github/workflows/bpf-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/security/bpf/**'
      - 'src/security/static/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - debug
        - release

# 环境变量
env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  # 构建矩阵：多架构支持
  build-libraries:
    name: Build Libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [x86_64, aarch64]
        language: [python, nodejs]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc libc6-dev
        sudo apt-get install -y python3 python3-pip
    
    - name: Set up cross-compilation for ARM64
      if: matrix.architecture == 'aarch64'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
    
    - name: Generate syscall definitions
      run: |
        cd src/security/bpf
        python3 generate_syscalls.py > syscalls_generated.h
        echo "Generated syscalls_generated.h:"
        head -20 syscalls_generated.h
    
    - name: Build library for ${{ matrix.language }}
      run: |
        cd src/security/bpf
        
        # 设置构建标志
        if [ "${{ env.BUILD_TYPE }}" = "debug" ]; then
          export CFLAGS="-Wall -Wextra -g -fPIC -std=c99 -DDEBUG"
        else
          export CFLAGS="-Wall -Wextra -O2 -fPIC -std=c99 -DNDEBUG"
        fi
        
        # 构建特定语言的库
        if [ "${{ matrix.architecture }}" = "aarch64" ]; then
          # ARM64交叉编译
          make ${{ matrix.language }} CC=aarch64-linux-gnu-gcc
        else
          # x86_64本地编译
          make ${{ matrix.language }}
        fi
        
        # 验证构建结果
        ls -la ../../../build/lib/
        file ../../../build/lib/libseccomp_injector_${{ matrix.language }}.so
    
    - name: Test library symbols
      run: |
        cd build/lib
        if [ -f "libseccomp_injector_${{ matrix.language }}.so" ]; then
          echo "Library symbols for ${{ matrix.language }}:"
          nm -D libseccomp_injector_${{ matrix.language }}.so | grep -E "(inject_seccomp|setup_no_new|drop_privileges|apply_seccomp)"
          
          echo "Library info:"
          file libseccomp_injector_${{ matrix.language }}.so
          ldd libseccomp_injector_${{ matrix.language }}.so || true
        fi
    
    - name: Upload library artifact
      uses: actions/upload-artifact@v4
      with:
        name: libseccomp-${{ matrix.language }}-${{ matrix.architecture }}-${{ env.BUILD_TYPE }}
        path: |
          build/lib/libseccomp_injector_${{ matrix.language }}.so
          src/security/bpf/syscalls_generated.h
        retention-days: 30

  # 测试构建的库
  test-libraries:
    name: Test Built Libraries
    runs-on: ubuntu-latest
    needs: build-libraries
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock ctypes-sh
    
    - name: Organize libraries
      run: |
        mkdir -p build/lib
        find . -name "*.so" -exec cp {} build/lib/ \;
        ls -la build/lib/
    
    - name: Test library loading
      run: |
        python3 -c "
        import ctypes
        import os
        
        lib_dir = 'build/lib'
        for lib_file in os.listdir(lib_dir):
            if lib_file.endswith('.so'):
                lib_path = os.path.join(lib_dir, lib_file)
                print(f'Testing {lib_file}...')
                try:
                    lib = ctypes.CDLL(lib_path)
                    print(f'  ✓ Successfully loaded {lib_file}')
                    
                    # 测试函数是否存在
                    functions = ['inject_seccomp_profile', 'setup_no_new_privs', 'drop_privileges']
                    for func_name in functions:
                        try:
                            func = getattr(lib, func_name)
                            print(f'  ✓ Function {func_name} found')
                        except AttributeError:
                            print(f'  ✗ Function {func_name} not found')
                            
                except Exception as e:
                    print(f'  ✗ Failed to load {lib_file}: {e}')
        "
    
    - name: Run BPF module tests with built libraries
      run: |
        export LD_LIBRARY_PATH=$PWD/build/lib:$LD_LIBRARY_PATH
        python -m pytest tests/security/test_bpf_module.py::TestGeneratedLibraries -v

  # 创建发布包
  create-release-package:
    name: Create Release Package
    runs-on: ubuntu-latest
    needs: [build-libraries, test-libraries]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Create release structure
      run: |
        mkdir -p release/lib/x86_64
        mkdir -p release/lib/aarch64
        mkdir -p release/include
        mkdir -p release/docs
        
        # 组织库文件
        find . -path "*x86_64*" -name "*.so" -exec cp {} release/lib/x86_64/ \;
        find . -path "*aarch64*" -name "*.so" -exec cp {} release/lib/aarch64/ \;
        
        # 复制头文件
        cp src/security/bpf/seccomp_injector.h release/include/
        find . -name "syscalls_generated.h" -exec cp {} release/include/ \; | head -1
        
        # 创建文档
        cat > release/README.md << 'EOF'
        # Seccomp Injector Libraries
        
        This package contains pre-built seccomp injector libraries for the simple-sandbox project.
        
        ## Contents
        
        - `lib/x86_64/`: Libraries for x86_64 architecture
        - `lib/aarch64/`: Libraries for ARM64 architecture
        - `include/`: Header files
        - `docs/`: Documentation
        
        ## Libraries
        
        - `libseccomp_injector_python.so`: Python runtime seccomp filter
        - `libseccomp_injector_nodejs.so`: Node.js runtime seccomp filter
        
        ## Usage
        
        ```c
        #include "seccomp_injector.h"
        
        // Apply seccomp profile with privilege dropping
        int result = inject_seccomp_profile(1000, 1000);  // uid, gid
        if (result != SECCOMP_SUCCESS) {
            fprintf(stderr, "Seccomp injection failed: %s\n", get_error_description(result));
        }
        ```
        
        ## Build Information
        
        - Built on: $(date)
        - Commit: ${{ github.sha }}
        - Ref: ${{ github.ref }}
        EOF
        
        # 创建版本信息
        cat > release/VERSION << EOF
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        COMMIT_SHA=${{ github.sha }}
        COMMIT_REF=${{ github.ref }}
        BUILD_TYPE=${{ env.BUILD_TYPE }}
        EOF
        
        # 显示结构
        find release -type f | sort
    
    - name: Create tarball
      run: |
        tar -czf seccomp-injector-libraries.tar.gz -C release .
        
        echo "Package contents:"
        tar -tzf seccomp-injector-libraries.tar.gz | head -20
        
        echo "Package size:"
        ls -lh seccomp-injector-libraries.tar.gz
    
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: seccomp-injector-release-${{ github.sha }}
        path: |
          seccomp-injector-libraries.tar.gz
          release/
        retention-days: 90
    
    - name: Upload to release (if release event)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./seccomp-injector-libraries.tar.gz
        asset_name: seccomp-injector-libraries.tar.gz
        asset_content_type: application/gzip

  # 验证发布包
  verify-release:
    name: Verify Release Package
    runs-on: ubuntu-latest
    needs: create-release-package
    
    steps:
    - name: Download release package
      uses: actions/download-artifact@v3
      with:
        name: seccomp-injector-release-${{ github.sha }}
    
    - name: Verify package contents
      run: |
        echo "Extracting package..."
        tar -xzf seccomp-injector-libraries.tar.gz
        
        echo "Verifying structure..."
        test -d lib/x86_64 || (echo "Missing x86_64 lib directory" && exit 1)
        test -d lib/aarch64 || (echo "Missing aarch64 lib directory" && exit 1)
        test -d include || (echo "Missing include directory" && exit 1)
        test -f README.md || (echo "Missing README.md" && exit 1)
        test -f VERSION || (echo "Missing VERSION file" && exit 1)
        
        echo "Verifying libraries..."
        find lib -name "*.so" | while read lib; do
          echo "Checking $lib..."
          file "$lib"
          nm -D "$lib" | grep -q "inject_seccomp_profile" || (echo "Missing inject_seccomp_profile in $lib" && exit 1)
        done
        
        echo "✓ Package verification successful"
        
        echo "Package summary:"
        find . -type f | sort
        
        echo "Library details:"
        find lib -name "*.so" -exec ls -lh {} \;

  # 清理旧的artifacts
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [verify-release]
    if: always() && github.event_name == 'push'
    
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v6
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const oldArtifacts = artifacts.data.artifacts
            .filter(artifact => {
              const ageInDays = (Date.now() - new Date(artifact.created_at)) / (1000 * 60 * 60 * 24);
              return ageInDays > 7 && artifact.name.includes('libseccomp');
            })
            .slice(10); // Keep at least 10 recent artifacts
          
          for (const artifact of oldArtifacts) {
            console.log(`Deleting artifact: ${artifact.name} (${artifact.created_at})`);
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id
            });
          }