name: Security Module Tests

# 触发条件
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/security/**'
      - 'tests/security/**'
      - '.github/workflows/security-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/security/**'
      - 'tests/security/**'
      - '.github/workflows/security-tests.yml'
  workflow_dispatch:

# 环境变量
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # 跨平台基础测试
  cross-platform-tests:
    name: Cross-Platform Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock pytest-timeout pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi
    
    - name: Run cross-platform tests
      run: |
        python -m pytest tests/security/test_security_cross_platform.py -v --tb=short
    
    - name: Run BPF module tests (non-compilation)
      run: |
        python -m pytest tests/security/test_bpf_module.py::TestSyscallGeneration -v --tb=short
        python -m pytest tests/security/test_bpf_module.py::TestMakefileConfiguration -v --tb=short
        python -m pytest tests/security/test_bpf_module.py::TestCrossPlatformCompatibility -v --tb=short
        python -m pytest tests/security/test_bpf_module.py::TestErrorHandling -v --tb=short

  # Linux完整测试（包括seccomp功能）
  linux-full-tests:
    name: Linux Full Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
        architecture: ['x64']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc libc6-dev linux-headers-generic
        sudo apt-get install -y libseccomp-dev libseccomp2
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock pytest-timeout pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi
    
    - name: Test BPF module compilation
      run: |
        cd src/security/bpf
        make check-deps
        make info
        make clean
        python generate_syscalls.py > syscalls_generated.h
        make test-compile
    
    - name: Build seccomp libraries
      run: |
        cd src/security/bpf
        make clean
        make all
        ls -la ../../../build/lib/
    
    - name: Run BPF module tests
      run: |
        python -m pytest tests/security/test_bpf_module.py -v --tb=short
    
    - name: Run full security tests
      run: |
        python tests/security/run_tests.py
    
    - name: Test library symbols
      run: |
        if [ -f build/lib/libseccomp_injector_python.so ]; then
          nm -D build/lib/libseccomp_injector_python.so | grep -E "(inject_seccomp|setup_no_new|drop_privileges)"
        fi
        if [ -f build/lib/libseccomp_injector_nodejs.so ]; then
          nm -D build/lib/libseccomp_injector_nodejs.so | grep -E "(inject_seccomp|setup_no_new|drop_privileges)"
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: seccomp-libraries-${{ matrix.python-version }}
        path: |
          build/lib/*.so
          src/security/bpf/syscalls_generated.h
        retention-days: 7

  # 代码质量检查
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort mypy pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi
    
    - name: Run ruff linting
      run: |
        ruff check src/security/ tests/security/ --output-format=github
    
    - name: Run black formatting check
      run: |
        black --check --diff src/security/ tests/security/
    
    - name: Run isort import sorting check
      run: |
        isort --check-only --diff src/security/ tests/security/
    
    - name: Run mypy type checking
      run: |
        mypy src/security/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true
    
    - name: Check C code formatting (if clang-format available)
      run: |
        if command -v clang-format >/dev/null 2>&1; then
          find src/security/bpf -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror
        else
          echo "clang-format not available, skipping C code formatting check"
        fi
      continue-on-error: true

  # 性能测试
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark pytest-timeout
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi
    
    - name: Run performance tests
      run: |
        python -m pytest tests/security/test_security_performance.py -v --tb=short -s
      continue-on-error: true

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run bandit security linter
      run: |
        bandit -r src/security/ -f json -o bandit-report.json
        bandit -r src/security/ -f txt
      continue-on-error: true
    
    - name: Run safety dependency check
      run: |
        safety check --json --output safety-report.json
        safety check
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  # 覆盖率报告
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [cross-platform-tests, linux-full-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc libc6-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-timeout
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi
    
    - name: Run tests with coverage
      run: |
        python -m pytest tests/security/ --cov=src.security --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: security-module
        name: security-module-coverage
        fail_ci_if_error: false
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30

  # 多架构测试（ARM64）
  multi-arch-tests:
    name: Multi-Architecture Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Test ARM64 compilation
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/src/security/bpf \
          ubuntu:22.04 \
          bash -c "
            apt-get update && \
            apt-get install -y build-essential python3 && \
            make info && \
            python3 generate_syscalls.py > syscalls_generated.h && \
            make test-compile
          "
      continue-on-error: true

  # 集成测试总结
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [cross-platform-tests, linux-full-tests, code-quality]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "Cross-platform tests: ${{ needs.cross-platform-tests.result }}"
        echo "Linux full tests: ${{ needs.linux-full-tests.result }}"
        echo "Code quality: ${{ needs.code-quality.result }}"
        
        if [[ "${{ needs.cross-platform-tests.result }}" == "failure" || 
              "${{ needs.linux-full-tests.result }}" == "failure" || 
              "${{ needs.code-quality.result }}" == "failure" ]]; then
          echo "Some tests failed!"
          exit 1
        else
          echo "All critical tests passed!"
        fi