[tool:pytest]
# 测试发现
testpaths = tests
python_files = test_*.py *_test.py test-*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --durations=10
    --color=yes

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    security: 安全测试
    performance: 性能测试
    slow: 慢速测试（执行时间较长）
    linux_only: 仅在Linux环境下运行
    macos_only: 仅在macOS环境下运行
    windows_only: 仅在Windows环境下运行
    requires_docker: 需要Docker环境
    requires_network: 需要网络连接
    smoke: 冒烟测试
    regression: 回归测试
    api: API测试
    runtime: 运行时测试
    models: 模型测试
    routes: 路由测试
    manager: 管理器测试
    seccomp: Seccomp测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:requests.*
    ignore::UserWarning:urllib3.*

# 最小版本要求
minversion = 6.0

# 测试会话配置
console_output_style = progress
junit_family = xunit2

# 异步测试支持
asyncio_mode = auto

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 文件日志
log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 缓存配置
cache_dir = .pytest_cache
