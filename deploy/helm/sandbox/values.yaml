# Default values for code-sandbox
replicaCount: 1

image:
  repository: codesandbox/sandbox
  pullPolicy: IfNotPresent
  tag: "latest"
  registry: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: "RuntimeDefault"

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Ingress disabled (internal service only)
ingress:
  enabled: false

# Resource limits
resources:
  limits:
    cpu: "1"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Health checks
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

# Autoscaling
autoscaling:
  enabled: false

# Network policy
networkPolicy:
  enabled: true

# Application configuration
app:
  host: "0.0.0.0"
  port: 8000
  debug: false
  verbose: false

# Node selector and tolerations
nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env: []
